name: Build Deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos and dependencies
        run: |
          # 1. Cài đặt các gói phụ thuộc cho Linux
          sudo apt-get update
          sudo apt-get install -y ldid dpkg fakeroot make curl unzip
          
          # 2. Clone Theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # 3. Tải toàn bộ bộ SDK iOS
          mkdir -p $HOME/theos/sdks
          cd $HOME/theos/sdks
          curl -L -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk .
          rm -rf sdks-master sdks.zip

      - name: Build ROOTFUL package
        run: |
          make clean || true
          make package FINALPACKAGE=1
          mkdir -p output/rootful
          mv packages/*.deb output/rootful/ 2>/dev/null || true

      - name: Build ROOTLESS package
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p output/rootless
          mv packages/*.deb output/rootless/ 2>/dev/null || true

      - name: Upload .deb files
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayVideoWallpaper-debs
          path: output/**/*.deb
          if-no-files-found: warn
