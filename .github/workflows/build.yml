name: Build Deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Build ROOTFUL package
        run: |
          make clean || true
          make package FINALPACKAGE=1
          mkdir -p output/rootful
          mv packages/*.deb output/rootful/ 2>/dev/null || true

      - name: Build ROOTLESS package
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p output/rootless
          mv packages/*.deb output/rootless/ 2>/dev/null || true

      - name: Upload .deb files
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayVideoWallpaper-debs
          path: output/**/*.deb
          if-no-files-found: warn
